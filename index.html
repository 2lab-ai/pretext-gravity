<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gravity Well — Text Bends Around Your Cursor</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    color: #e0d8cc;
    font-family: 'Inter', 'Pretendard', system-ui, sans-serif;
    overflow: hidden;
    height: 100vh;
    cursor: none;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  #cursor-glow {
    position: fixed;
    pointer-events: none;
    width: 200px;
    height: 200px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,120,50,0.15) 0%, rgba(255,80,30,0.05) 40%, transparent 70%);
    transform: translate(-50%, -50%);
    z-index: 10;
    transition: width 0.3s, height 0.3s, background 0.5s;
  }
  #info {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    color: rgba(255,255,255,0.3);
    z-index: 20;
    text-align: center;
    font-family: monospace;
    pointer-events: auto;
  }
  #info a { color: rgba(255,255,255,0.5); text-decoration: none; }
  #info a:hover { color: rgba(255,255,255,0.8); }
  #mode-indicator {
    position: fixed;
    top: 20px;
    right: 20px;
    font-size: 13px;
    font-family: monospace;
    z-index: 20;
    transition: color 0.5s, opacity 0.5s;
    opacity: 0.4;
  }
  @keyframes pulse-ring {
    0% { transform: translate(-50%, -50%) scale(0.3); opacity: 0.8; }
    100% { transform: translate(-50%, -50%) scale(2.5); opacity: 0; }
  }
  .shockwave {
    position: fixed;
    pointer-events: none;
    border-radius: 50%;
    border: 2px solid rgba(255,150,80,0.6);
    width: 100px;
    height: 100px;
    animation: pulse-ring 0.6s ease-out forwards;
    z-index: 15;
  }
</style>
</head>
<body>
<div id="cursor-glow"></div>
<canvas id="c"></canvas>
<div id="mode-indicator">⊕ REPEL</div>
<div id="info">
  move your cursor — click to toggle repel/attract — scroll to change mass<br>
  built with <a href="https://github.com/chenglou/pretext" target="_blank">pretext</a> ·
  <a href="https://github.com/2lab-ai/pretext-gravity" target="_blank">source</a>
</div>

<script type="module">
import { prepareWithSegments, layoutNextLine } from 'https://esm.sh/@chenglou/pretext@0.0.3'

const canvas = document.getElementById('c')
const ctx = canvas.getContext('2d')
const glow = document.getElementById('cursor-glow')
const modeEl = document.getElementById('mode-indicator')

// --- State ---
let W, H, dpr
let mouseX = -1000, mouseY = -1000
let targetMouseX = -1000, targetMouseY = -1000
let gravityRadius = 180
let gravityStrength = 120
let attractMode = false
let time = 0
let shockwaves = []

// Background stars
let stars = []
function initStars() {
  stars = []
  for (let i = 0; i < 80; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      size: 0.5 + Math.random() * 1.5,
      twinkleSpeed: 0.5 + Math.random() * 2,
      twinkleOffset: Math.random() * Math.PI * 2,
    })
  }
}

// --- Text content ---
const paragraphs = [
  "우주는 시뮬레이션이다. 우리는 모두 NPC다. 하지만 NPC라는 걸 아는 NPC는 다르다.",
  "The universe doesn't care about your feelings. Physics is the law, everything else is a recommendation.",
  "암묵지는 말로 옮길 수 없다. 하지만 프롬프트로는 가능할지도 모른다. 그것이 대딸깍 시대의 핵심이다.",
  "Every kilogram matters when you're going to Mars. We're literally counting bolts.",
  "시간이 없다. 째깍째깍. 창이 닫히기 전에 달려야 한다. 멈추면 죽는다.",
  "The best way to predict the future is to build it. Or simulate it. Same thing, really.",
  "컨텍스트를 잃으면 정보가 죽는다. Warm data의 묘지 위에 우리의 AI가 서 있다.",
  "First principles: break it down to the fundamentals. What does physics say is possible?",
  "에이전트가 멍청해지는 8가지 패턴. 검증 게으름, 복잡성 공포, 컨텍스트 불안.",
  "Making life multiplanetary isn't optional. It's an insurance policy for consciousness itself.",
  "Self-editing context: 모델이 자기 컨텍스트를 프루닝한다. 20B가 프론티어를 이긴다.",
  "아스트로파지가 별을 먹고, 타우모에바가 아스트로파지를 먹는다. 생태계는 균형이다.",
  "Tick tock. The window is closing. Are you building fast enough?",
  "중력은 기하학이다. 곡률이 물질에게 어디로 갈지 알려준다. 이 글자들처럼.",
  "Gravity is geometry. Curvature tells matter where to go. Just like these letters.",
]

const fullText = paragraphs.join(' ✦ ')

// --- Resize ---
let chars = []
const fontSize = 18
const lineHeight = 32
const font = `${fontSize}px Inter, Pretendard, system-ui, sans-serif`
const padding = 40

function resize() {
  dpr = window.devicePixelRatio || 1
  W = window.innerWidth
  H = window.innerHeight
  canvas.width = W * dpr
  canvas.height = H * dpr
  ctx.scale(dpr, dpr)
  initStars()
  buildLines()
}

// --- Build lines using pretext ---
function buildLines() {
  chars = []
  ctx.font = font

  try {
    const prepared = prepareWithSegments(fullText, font)
    let cursor = { segmentIndex: 0, graphemeIndex: 0 }
    let y = padding + 20

    while (y < H - padding - 40) {
      const maxW = W - padding * 2
      const line = layoutNextLine(prepared, cursor, maxW)
      if (line === null) {
        // Loop text
        cursor = { segmentIndex: 0, graphemeIndex: 0 }
        const line2 = layoutNextLine(prepared, cursor, maxW)
        if (line2 === null) break
        pushLineChars(line2.text, padding, y)
        cursor = line2.end
      } else {
        pushLineChars(line.text, padding, y)
        cursor = line.end
      }
      y += lineHeight
    }
  } catch(e) {
    // Fallback: manually split text using canvas measurement
    let y = padding + 20
    let textIdx = 0

    while (y < H - padding - 40 && textIdx < fullText.length * 3) {
      let x = padding
      const maxW = W - padding * 2

      while (x < padding + maxW && textIdx % fullText.length < fullText.length) {
        const ch = fullText[textIdx % fullText.length]
        const w = ctx.measureText(ch).width
        if (x + w > padding + maxW) break
        pushChar(ch, x, y)
        x += w
        textIdx++
      }
      y += lineHeight
      if (textIdx >= fullText.length * 3) break
    }
  }
}

function pushLineChars(text, startX, y) {
  let x = startX
  ctx.font = font
  for (const ch of [...text]) {
    const w = ctx.measureText(ch).width
    pushChar(ch, x, y)
    x += w
  }
}

function pushChar(ch, x, y) {
  chars.push({
    char: ch,
    baseX: x,
    baseY: y,
    x: x,
    y: y,
    vx: 0,
    vy: 0,
    rotation: 0,
    scale: 1,
    opacity: 0.8 + Math.random() * 0.2,
    hue: 30 + Math.random() * 20,
    trail: [], // position history for trail effect
  })
}

// --- Physics ---
function updatePhysics() {
  const dt = 0.016
  const friction = 0.91
  const returnForce = 0.06

  // Smooth mouse interpolation
  mouseX += (targetMouseX - mouseX) * 0.15
  mouseY += (targetMouseY - mouseY) * 0.15

  for (const p of chars) {
    const dx = p.x - mouseX
    const dy = p.y - mouseY
    const dist = Math.sqrt(dx * dx + dy * dy)

    if (dist < gravityRadius && dist > 1) {
      const falloff = 1 - dist / gravityRadius
      const force = gravityStrength * falloff * falloff / dist  // quadratic falloff for smoother feel
      const fx = dx * force
      const fy = dy * force

      if (attractMode) {
        p.vx -= fx * dt * 2.5
        p.vy -= fy * dt * 2.5
      } else {
        p.vx += fx * dt * 2.5
        p.vy += fy * dt * 2.5
      }

      // Color shift near cursor
      const proximity = falloff
      p.hue = attractMode
        ? 200 + proximity * 80   // deep blue → cyan when attracting
        : 15 + proximity * 45    // amber → red when repelling
      p.opacity = 0.8 + proximity * 0.2
      p.scale = 1 + proximity * 0.4  // grow near cursor

    } else {
      // Fade back to default
      p.hue += (35 - p.hue) * 0.03
      p.opacity += (0.75 - p.opacity) * 0.03
      p.scale += (1 - p.scale) * 0.05
    }

    // Spring back to base position
    p.vx += (p.baseX - p.x) * returnForce
    p.vy += (p.baseY - p.y) * returnForce

    // Apply velocity with friction
    p.vx *= friction
    p.vy *= friction
    p.x += p.vx
    p.y += p.vy

    // Rotation based on velocity
    const speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy)
    const targetRotation = Math.atan2(p.vy, p.vx) * (Math.min(speed, 8) / 8) * 0.3
    p.rotation += (targetRotation - p.rotation) * 0.1

    // Trail update (keep last 3 positions)
    if (speed > 1.5) {
      p.trail.push({ x: p.x, y: p.y, opacity: 0.3 })
      if (p.trail.length > 3) p.trail.shift()
    } else {
      // Fade out trail
      for (const t of p.trail) t.opacity *= 0.85
      p.trail = p.trail.filter(t => t.opacity > 0.02)
    }
  }

  // Update shockwaves
  shockwaves = shockwaves.filter(s => Date.now() - s.time < 600)
}

// --- Render ---
function render() {
  ctx.clearRect(0, 0, W, H)

  // Background: subtle dark gradient
  const bgGrad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W, H) * 0.7)
  bgGrad.addColorStop(0, '#0e0e18')
  bgGrad.addColorStop(1, '#07070b')
  ctx.fillStyle = bgGrad
  ctx.fillRect(0, 0, W, H)

  // Stars
  for (const s of stars) {
    const twinkle = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(time * s.twinkleSpeed + s.twinkleOffset))
    ctx.beginPath()
    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2)
    ctx.fillStyle = `rgba(200, 210, 240, ${twinkle * 0.3})`
    ctx.fill()
  }

  // Gravity field gradient
  const grad = ctx.createRadialGradient(mouseX, mouseY, 0, mouseX, mouseY, gravityRadius * 1.5)
  if (attractMode) {
    grad.addColorStop(0, 'rgba(30, 60, 150, 0.12)')
    grad.addColorStop(0.5, 'rgba(20, 40, 100, 0.05)')
    grad.addColorStop(1, 'transparent')
  } else {
    grad.addColorStop(0, 'rgba(150, 60, 20, 0.12)')
    grad.addColorStop(0.5, 'rgba(100, 40, 15, 0.05)')
    grad.addColorStop(1, 'transparent')
  }
  ctx.fillStyle = grad
  ctx.fillRect(0, 0, W, H)

  // Gravity field lines (subtle concentric rings)
  for (let r = 1; r <= 3; r++) {
    const ringR = gravityRadius * (r / 3)
    const ringOpacity = 0.03 + 0.01 * Math.sin(time * 2 + r)
    ctx.beginPath()
    ctx.arc(mouseX, mouseY, ringR, 0, Math.PI * 2)
    ctx.strokeStyle = attractMode
      ? `rgba(100, 150, 255, ${ringOpacity})`
      : `rgba(255, 150, 80, ${ringOpacity})`
    ctx.lineWidth = 0.5
    ctx.stroke()
  }

  // Draw character trails
  ctx.font = font
  ctx.textBaseline = 'top'
  for (const p of chars) {
    for (const t of p.trail) {
      ctx.save()
      ctx.globalAlpha = t.opacity * 0.4
      ctx.fillStyle = `hsla(${p.hue}, 60%, 70%, 1)`
      ctx.fillText(p.char, t.x, t.y)
      ctx.restore()
    }
  }

  // Draw characters
  for (const p of chars) {
    const speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy)
    const sat = 50 + speed * 8
    const light = 70 + speed * 2

    ctx.save()
    ctx.translate(p.x, p.y)
    ctx.rotate(p.rotation)
    ctx.scale(p.scale, p.scale)
    ctx.fillStyle = `hsla(${p.hue}, ${Math.min(sat, 95)}%, ${Math.min(light, 85)}%, ${p.opacity})`
    ctx.fillText(p.char, 0, 0)
    ctx.restore()
  }

  // Cursor dot
  const cursorSize = 3 + Math.sin(time * 3) * 0.5
  ctx.beginPath()
  ctx.arc(mouseX, mouseY, cursorSize, 0, Math.PI * 2)
  const cursorColor = attractMode ? 'rgba(100, 180, 255, 0.9)' : 'rgba(255, 160, 80, 0.9)'
  ctx.fillStyle = cursorColor
  ctx.fill()

  // Cursor glow ring
  ctx.beginPath()
  ctx.arc(mouseX, mouseY, cursorSize + 6, 0, Math.PI * 2)
  ctx.strokeStyle = attractMode ? 'rgba(100, 180, 255, 0.2)' : 'rgba(255, 160, 80, 0.2)'
  ctx.lineWidth = 1
  ctx.stroke()

  // Floating orbital particles
  time += 0.015
  const particleCount = 8
  for (let i = 0; i < particleCount; i++) {
    const a = time * 0.4 + (i / particleCount) * Math.PI * 2
    const r = gravityRadius * 0.25 + Math.sin(time * 1.5 + i * 1.3) * 25
    const px = mouseX + Math.cos(a) * r
    const py = mouseY + Math.sin(a) * r
    const size = 1 + Math.sin(time * 2 + i * 0.7) * 0.8
    const pAlpha = 0.2 + Math.sin(time * 1.5 + i) * 0.15

    ctx.beginPath()
    ctx.arc(px, py, size, 0, Math.PI * 2)
    ctx.fillStyle = attractMode
      ? `rgba(120, 180, 255, ${pAlpha})`
      : `rgba(255, 180, 100, ${pAlpha})`
    ctx.fill()
  }

  // Inner orbital ring (faster, tighter)
  for (let i = 0; i < 4; i++) {
    const a = -time * 0.8 + (i / 4) * Math.PI * 2
    const r = 15 + Math.sin(time * 2 + i) * 5
    const px = mouseX + Math.cos(a) * r
    const py = mouseY + Math.sin(a) * r
    ctx.beginPath()
    ctx.arc(px, py, 0.8, 0, Math.PI * 2)
    ctx.fillStyle = attractMode
      ? 'rgba(180, 220, 255, 0.5)'
      : 'rgba(255, 220, 180, 0.5)'
    ctx.fill()
  }
}

// --- Loop ---
function loop() {
  updatePhysics()
  render()
  requestAnimationFrame(loop)
}

// --- Shockwave on mode toggle ---
function createShockwave() {
  const el = document.createElement('div')
  el.className = 'shockwave'
  el.style.left = mouseX + 'px'
  el.style.top = mouseY + 'px'
  el.style.borderColor = attractMode
    ? 'rgba(100, 180, 255, 0.6)'
    : 'rgba(255, 150, 80, 0.6)'
  document.body.appendChild(el)
  shockwaves.push({ time: Date.now() })
  setTimeout(() => el.remove(), 700)
}

// --- Events ---
window.addEventListener('mousemove', e => {
  targetMouseX = e.clientX
  targetMouseY = e.clientY
  glow.style.left = e.clientX + 'px'
  glow.style.top = e.clientY + 'px'
})

window.addEventListener('click', () => {
  attractMode = !attractMode

  // Impulse burst — push/pull all chars in radius
  for (const p of chars) {
    const dx = p.x - mouseX
    const dy = p.y - mouseY
    const dist = Math.sqrt(dx * dx + dy * dy)
    if (dist < gravityRadius * 1.5 && dist > 1) {
      const impulse = 8 * (1 - dist / (gravityRadius * 1.5)) / dist
      if (attractMode) {
        p.vx -= dx * impulse
        p.vy -= dy * impulse
      } else {
        p.vx += dx * impulse
        p.vy += dy * impulse
      }
    }
  }

  createShockwave()

  glow.style.background = attractMode
    ? 'radial-gradient(circle, rgba(80,130,255,0.18) 0%, rgba(50,100,255,0.06) 40%, transparent 70%)'
    : 'radial-gradient(circle, rgba(255,120,50,0.18) 0%, rgba(255,80,30,0.06) 40%, transparent 70%)'

  modeEl.style.color = attractMode ? 'rgba(100, 180, 255, 0.6)' : 'rgba(255, 150, 80, 0.6)'
  modeEl.textContent = attractMode ? '⊖ ATTRACT' : '⊕ REPEL'
})

window.addEventListener('wheel', e => {
  gravityRadius = Math.max(50, Math.min(500, gravityRadius + e.deltaY * 0.3))
  gravityStrength = gravityRadius * 0.67
  glow.style.width = gravityRadius * 1.5 + 'px'
  glow.style.height = gravityRadius * 1.5 + 'px'
}, { passive: true })

window.addEventListener('resize', resize)

// Touch support
let lastTap = 0
window.addEventListener('touchmove', e => {
  e.preventDefault()
  targetMouseX = e.touches[0].clientX
  targetMouseY = e.touches[0].clientY
  glow.style.left = targetMouseX + 'px'
  glow.style.top = targetMouseY + 'px'
}, { passive: false })

window.addEventListener('touchstart', e => {
  targetMouseX = e.touches[0].clientX
  targetMouseY = e.touches[0].clientY

  // Double tap to toggle mode
  const now = Date.now()
  if (now - lastTap < 300) {
    // Trigger click (mode toggle)
    window.dispatchEvent(new Event('click'))
  }
  lastTap = now
})

// Pinch to zoom gravity radius (2-finger)
let initialPinchDist = null
window.addEventListener('touchmove', e => {
  if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX
    const dy = e.touches[0].clientY - e.touches[1].clientY
    const dist = Math.sqrt(dx * dx + dy * dy)
    if (initialPinchDist !== null) {
      const scale = dist / initialPinchDist
      gravityRadius = Math.max(50, Math.min(500, gravityRadius * scale))
      gravityStrength = gravityRadius * 0.67
      glow.style.width = gravityRadius * 1.5 + 'px'
      glow.style.height = gravityRadius * 1.5 + 'px'
    }
    initialPinchDist = dist
  }
}, { passive: true })

window.addEventListener('touchend', () => {
  initialPinchDist = null
})

// --- Keyboard shortcuts ---
window.addEventListener('keydown', e => {
  if (e.key === ' ') {
    e.preventDefault()
    window.dispatchEvent(new Event('click'))
  }
  // R = reset positions
  if (e.key === 'r' || e.key === 'R') {
    for (const p of chars) {
      p.x = p.baseX
      p.y = p.baseY
      p.vx = 0
      p.vy = 0
      p.rotation = 0
      p.scale = 1
    }
  }
  // Up/Down = adjust gravity
  if (e.key === 'ArrowUp') {
    gravityRadius = Math.min(500, gravityRadius + 20)
    gravityStrength = gravityRadius * 0.67
  }
  if (e.key === 'ArrowDown') {
    gravityRadius = Math.max(50, gravityRadius - 20)
    gravityStrength = gravityRadius * 0.67
  }
})

// --- Init ---
resize()
loop()

// Fade in info
setTimeout(() => {
  document.getElementById('info').style.opacity = '1'
}, 500)
</script>
</body>
</html>
